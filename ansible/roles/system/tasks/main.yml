---
- name: Ensure admin users exist with required attributes
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: "{{ item.groups | default(['sudo']) }}"
    append: true
    state: present
  loop: "{{ admin_users | default([]) }}"
  become: true

- name: Ensure dedicated passwordless sudoers configuration for admin users
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/010_{{ item.name }}-nopasswd"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ admin_users | default([]) }}"
  become: true

- name: Ensure declared managed system services are in desired state
  ansible.builtin.systemd_service:
    name: "{{ item.key }}"
    state: "{{ item.value.state | default('started') }}"
    enabled: "{{ item.value.enabled | default(true) }}"
  loop: "{{ managed_services | default({}) | dict2items }}"
  when: (managed_services | default({}) | dict2items | length) > 0
  become: true
