all:
  hosts:
    rpi:
      ansible_host: "{{ lookup('ansible.builtin.env', 'SSH_HOST') | default('192.168.0.103', true) }}"
      ansible_port: "{{ lookup('ansible.builtin.env', 'SSH_PORT') | default('22', true) | int }}"
      ansible_user: "{{ lookup('ansible.builtin.env', 'SSH_USER') | default('kero', true) }}"
      ansible_password: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') | default(omit, true) }}"
      ansible_become_password: "{{ lookup('ansible.builtin.env', 'SUDO_PASSWORD') | default(lookup('ansible.builtin.env', 'SSH_PASSWORD') | default(omit, true), true) }}"
      ansible_python_interpreter: /usr/bin/python3
  children:
    servers:
      hosts:
        rpi:
